<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse The Range</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="browse-section">
      <div class="browse-header">
        <h1>Browse The Range</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
      </div>

      <div class="browse-grid">
        <div class="browse-card">
          <div class="card-image">
            <img
              src="https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=600&q=80"
              alt="Dining room decor"
            />
          </div>
          <h3 class="card-label">Dining</h3>
        </div>

        <div class="browse-card">
          <div class="card-image">
            <img
              src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&q=80"
              alt="Living room decor"
            />
          </div>
          <h3 class="card-label">Living</h3>
        </div>

        <div class="browse-card">
          <div class="card-image">
            <img
              src="https://images.unsplash.com/photo-1588046130717-0eb0c9a3ba15?w=600&q=80"
              alt="Bedroom decor"
            />
          </div>
          <h3 class="card-label">Bedroom</h3>
        </div>
      </div>
    </section>
  </body>
</html>
